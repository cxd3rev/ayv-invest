# Confirms the Next.js app builds on GitHub.
#
# GitHub Pages cannot host this app. Pages only serves static files, and its
# Next.js starter turns the project into a static export. AYV Invest needs a
# server for sign-in, transactions, and market prices, so that export fails.
# Deploy the live site on Vercel instead.

name: Build AYV Invest

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
